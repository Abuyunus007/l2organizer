<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Player Portal — l2organizer{% endblock %}</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, "Segoe UI", sans-serif;
      background: #14161a;
      color: #e6e6e6;
      font-size: 14px;
    }
    header {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      padding: 0.75rem 1.5rem;
      background: #1b1e24;
      border-bottom: 1px solid #2a2f38;
    }
    header .brand { font-weight: 700; }
    header .brand span { color: #7ec8e3; }
    header nav a { color: #9fb1c9; text-decoration: none; margin-right: 1rem; }
    header nav a:hover { color: #fff; }
    header .spacer { margin-left: auto; }
    header .who { color: #8b96a5; margin-right: 1rem; }
    header .logout button {
      background: none;
      border: 1px solid #2a2f38;
      color: #9fb1c9;
      border-radius: 6px;
      padding: 0.35rem 0.9rem;
      cursor: pointer;
    }
    header .logout button:hover { color: #fff; border-color: #3a4150; }
    main { padding: 1.5rem; max-width: 1280px; margin: 0 auto; }
    .card {
      background: #1b1e24;
      border: 1px solid #2a2f38;
      border-radius: 8px;
      padding: 1rem 1.25rem;
      margin-bottom: 1rem;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid #2a2f38; }
    th { color: #8b96a5; font-size: 0.8rem; text-transform: uppercase; }
    a { color: #7ec8e3; }
    .muted { color: #8b96a5; }
    .badge { display:inline-block; border-radius:4px; padding:0.05rem 0.4rem; font-size:0.75rem; background:#2a2f38; color:#b9c4d3; }
    .badge.online { background:#1e5c33; color:#9be8b5; }
    .badge.gm { background:#6b4d16; color:#ffd77a; }
    .msg { border-radius: 6px; padding: 0.55rem 0.8rem; margin-bottom: 1rem; }
    .msg.ok { background: #1e4d31; border: 1px solid #2e7a4d; color: #b4f0c9; }
    .msg.err { background: #4a1f1f; border: 1px solid #7a3333; color: #ffb4b4; }
    .charnav { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .charnav .who { font-weight: 700; font-size: 1.1rem; }
    .charnav nav { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .charnav nav a {
      color: #9fb1c9; text-decoration: none; padding: 0.35rem 0.8rem;
      border: 1px solid #2a2f38; border-radius: 6px; font-size: 13px;
    }
    .charnav nav a.on { background: #2b5f8f; border-color: #35719f; color: #fff; }
    .charnav nav a:hover { color: #fff; }
    .statgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
    a.statcard {
      display: block; text-decoration: none; color: #e6e6e6;
      background: #1b1e24; border: 1px solid #2a2f38; border-radius: 8px; padding: 1rem 1.1rem;
    }
    a.statcard:hover { border-color: #35719f; }
    a.statcard .t { font-size: 0.8rem; text-transform: uppercase; color: #8b96a5; margin-bottom: 0.3rem; }
    a.statcard .v { font-size: 1.15rem; color: #7ec8e3; font-weight: 700; }
    a.statcard .d { color: #8b96a5; font-size: 12px; margin-top: 0.2rem; }
    .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 1rem; }
    .item-row { display: flex; align-items: center; gap: 0.55rem; padding: 0.3rem 0.2rem; border-bottom: 1px solid #242933; }
    .item-row.material { background: rgba(46, 125, 50, 0.14); border-left: 3px solid #2e7d32; }
    .item-row:last-of-type { border-bottom: 0; }
    .item-row img { width: 32px; height: 32px; image-rendering: pixelated; flex: 0 0 auto; }
    .item-row .check { flex: 0 0 auto; width: 16px; height: 16px; }
    .item-row .meta { flex: 1 1 auto; min-width: 0; }
    .item-row .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-row .sub { color: #8b96a5; font-size: 11px; }
    .tools { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.7rem; padding-top: 0.7rem; border-top: 1px solid #2a2f38; }
    .tools button {
      background: #26303c; border: 1px solid #33404f; color: #b9d3e8;
      border-radius: 5px; padding: 0.35rem 0.7rem; font-size: 12px; cursor: pointer;
    }
    .tools button:hover { background: #2f3d4c; color: #fff; }
    .tools button.clan { border-color: #4a3d6b; color: #d3c0f0; }
    .tools button.warn { border-color: #6b5a16; color: #ffe28a; }
    .tools button.danger { border-color: #6b1f1f; color: #ffb4b4; }
    .tools button:disabled { opacity: 0.45; cursor: not-allowed; }
    h3 { margin: 0 0 0.25rem; display: flex; align-items: center; gap: 0.6rem; }
    h3 label.selall { font-size: 11px; color: #8b96a5; font-weight: normal; text-transform: none; display: inline-flex; align-items: center; gap: 0.3rem; cursor: pointer; }
    .cap { color: #8b96a5; font-size: 12px; margin: 0 0 0.6rem; }
    .empty { color: #8b96a5; font-size: 13px; }
    .hint { color: #8fb8a0; font-size: 11px; }
    .cicon { width: 24px; height: 24px; image-rendering: pixelated; vertical-align: middle; }
    .bad { color: #ffb4b4; }
    .ing { display: inline-flex; align-items: center; gap: 0.25rem; margin-right: 0.5rem; font-size: 11px; color: #b9c4d3; }
    .ing img { width: 18px; height: 18px; image-rendering: pixelated; }
    .ing.bad { color: #ffb4b4; }
    .qty { width: 70px; background: #14161a; border: 1px solid #2a2f38; border-radius: 5px; color: #e6e6e6; padding: 0.2rem 0.4rem; font-size: 12px; }
    .craft-table td { vertical-align: top; }
    h4 { margin: 1rem 0 0.4rem; }
    .shopbox { margin-bottom: 0.75rem; }
    .title-input { background: #14161a; border: 1px solid #2a2f38; border-radius: 6px; color: #e6e6e6; padding: 0.45rem 0.7rem; width: 320px; }
  </style>
</head>
<body>
  <header>
    <span class="brand">l2organizer <span>portal</span></span>
    <nav>
      <a href="/my">My Characters</a>
    </nav>
    <div class="spacer"></div>
    <span class="who">{% block who %}{% endblock %}</span>
    <form class="logout" method="post" action="/my/logout">
      <button type="submit">Logout</button>
    </form>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
