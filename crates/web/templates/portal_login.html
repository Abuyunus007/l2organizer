<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Player Portal</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, "Segoe UI", sans-serif;
      background: #14161a;
      color: #e6e6e6;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .login-card {
      background: #1b1e24;
      border: 1px solid #2a2f38;
      border-radius: 10px;
      padding: 2rem;
      width: 380px;
    }
    h1 { margin: 0 0 0.5rem; font-size: 1.25rem; }
    p.hint { color: #8b96a5; margin: 0 0 1.25rem; font-size: 0.85rem; }
    label { display: block; color: #8b96a5; font-size: 0.8rem; text-transform: uppercase; margin-bottom: 0.3rem; }
    input {
      width: 100%;
      background: #14161a;
      border: 1px solid #2a2f38;
      border-radius: 6px;
      color: #e6e6e6;
      padding: 0.55rem 0.7rem;
      margin-bottom: 1rem;
    }
    button {
      width: 100%;
      background: #2b5f8f;
      border: 0;
      border-radius: 6px;
      color: #fff;
      padding: 0.6rem 1rem;
      cursor: pointer;
      font-size: 0.95rem;
    }
    button:hover { background: #35719f; }
    .error {
      background: #4a1f1f;
      border: 1px solid #7a3333;
      color: #ffb4b4;
      border-radius: 6px;
      padding: 0.5rem 0.75rem;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }
    .brand { color: #7ec8e3; font-weight: 700; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1><span class="brand">l2organizer</span> — player portal</h1>
    <p class="hint">Log in with your game account to manage your characters' items.</p>
    {% if !error.is_empty() %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form method="post" action="/my/login">
      <label for="login">Account</label>
      <input id="login" name="login" type="text" autocomplete="username" autofocus required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
  </div>
</body>
</html>
