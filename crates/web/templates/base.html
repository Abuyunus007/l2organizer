<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}l2organizer{% endblock %}</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, "Segoe UI", sans-serif;
      background: #14161a;
      color: #e6e6e6;
      font-size: 14px;
    }
    header {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      padding: 0.75rem 1.5rem;
      background: #1b1e24;
      border-bottom: 1px solid #2a2f38;
    }
    header .brand { font-weight: 700; letter-spacing: 0.02em; }
    header nav a {
      color: #9fb1c9;
      text-decoration: none;
      margin-right: 1rem;
    }
    header nav a:hover { color: #ffffff; }
    header .logout { margin-left: auto; }
    header .logout button {
      background: none;
      border: 1px solid #2a2f38;
      color: #9fb1c9;
      border-radius: 6px;
      padding: 0.35rem 0.9rem;
      cursor: pointer;
    }
    header .logout button:hover { color: #fff; border-color: #3a4150; }
    main { padding: 1.5rem; max-width: 1280px; margin: 0 auto; }
    .card {
      background: #1b1e24;
      border: 1px solid #2a2f38;
      border-radius: 8px;
      padding: 1rem 1.25rem;
      margin-bottom: 1rem;
    }
    .stats { display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 1rem; }
    .stat {
      background: #1b1e24;
      border: 1px solid #2a2f38;
      border-radius: 8px;
      padding: 0.75rem 1.25rem;
      min-width: 140px;
    }
    .stat .num { font-size: 1.5rem; font-weight: 700; color: #7ec8e3; }
    .stat .lbl { color: #8b96a5; font-size: 0.8rem; text-transform: uppercase; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid #2a2f38; }
    th { color: #8b96a5; font-weight: 600; font-size: 0.8rem; text-transform: uppercase; }
    tr:hover td { background: #20242c; }
    input[type=text], input[type=search] {
      background: #14161a;
      border: 1px solid #2a2f38;
      border-radius: 6px;
      color: #e6e6e6;
      padding: 0.45rem 0.7rem;
      min-width: 280px;
    }
    button {
      background: #2b5f8f;
      border: 0;
      border-radius: 6px;
      color: #fff;
      padding: 0.45rem 1rem;
      cursor: pointer;
    }
    button:hover { background: #35719f; }
    form.search { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .badge {
      display: inline-block;
      border-radius: 4px;
      padding: 0.05rem 0.4rem;
      font-size: 0.75rem;
      background: #2a2f38;
      color: #b9c4d3;
    }
    .badge.online { background: #1e5c33; color: #9be8b5; }
    .badge.gm { background: #6b4d16; color: #ffd77a; }
    .badge.nobless { background: #4a2a6b; color: #d9a8ff; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, 52px);
      gap: 4px;
    }
    .slot {
      width: 52px;
      height: 52px;
      background: #101216;
      border: 1px solid #2a2f38;
      border-radius: 4px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .slot img { width: 32px; height: 32px; image-rendering: pixelated; }
    .slot .cnt {
      position: absolute;
      right: 2px;
      bottom: 0;
      font-size: 10px;
      color: #e6e6e6;
      text-shadow: 0 0 2px #000;
    }
    .slot .ench {
      position: absolute;
      left: 2px;
      bottom: 0;
      font-size: 10px;
      color: #7ec8e3;
      text-shadow: 0 0 2px #000;
    }
    a { color: #7ec8e3; }
    .muted { color: #8b96a5; }
    .msgdiv { border-radius: 6px; padding: 0.55rem 0.8rem; margin-bottom: 1rem; }
    .msgdiv.ok { background: #1e4d31; border: 1px solid #2e7a4d; color: #b4f0c9; }
    .msgdiv.err { background: #4a1f1f; border: 1px solid #7a3333; color: #ffb4b4; }
    .rowform { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; margin-bottom: 0.6rem; }
    .editgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.5rem; margin: 0.5rem 0; }
    .editgrid input, .editgrid select {
      background: #14161a; border: 1px solid #2a2f38; border-radius: 5px;
      color: #e6e6e6; padding: 0.3rem 0.5rem; width: 100%;
    }
    select {
      background: #14161a; border: 1px solid #2a2f38; border-radius: 6px;
      color: #e6e6e6; padding: 0.45rem 0.7rem;
    }
    h4 { margin: 1rem 0 0.4rem; }
    button.dangerbtn { background: #7a3333; }
    button.dangerbtn:hover { background: #9b4141; }
  </style>
</head>
<body>
  <header>
    <span class="brand">l2organizer</span>
    <nav>
      <a href="/">Dashboard</a>
      <a href="/accounts">Accounts</a>
      <a href="/characters">Characters</a>
      <a href="/items">Items</a>
      <a href="/moves">Moves</a>
      <a href="/ops">Ops</a>
    </nav>
    <form class="logout" method="post" action="/logout">
      <button type="submit">Logout</button>
    </form>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
