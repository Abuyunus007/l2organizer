[workspace]
resolver = "3"
members = ["crates/core", "crates/icons", "crates/web"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "mysql", "chrono", "macros", "migrate"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
askama = "0.14"
tower-http = { version = "0.6", features = ["trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
roxmltree = "0.20"
